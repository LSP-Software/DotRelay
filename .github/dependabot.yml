version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compatible-bun-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compatible-actions-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: weekly
    groups:
      compatible-docker-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compatible-compose-updates:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
