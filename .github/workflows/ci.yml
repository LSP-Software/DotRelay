name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run tracked-tree:clean

  build-smoke:
    name: build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run tracked-tree:clean
      - run: bun run smoke
      - run: bun run tracked-tree:clean

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:unit
      - run: bun run tracked-tree:clean

  integration:
    name: PostgreSQL and Valkey integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - run: bun run tracked-tree:clean

  browser-e2e:
    name: browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run tracked-tree:clean

  cli-round-trip:
    name: packaged CLI round trip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run test:cli
      - run: bun run test:cli:live
      - run: bun run tracked-tree:clean

  e2e-full:
    name: full-stack e2e (packaged CLI against real API + Postgres + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # The harness treats this as an ADMIN connection: it is a superuser on
      # this container, so it uses it to CREATE and DROP a throwaway database
      # per run. The maintenance "postgres" database always exists for that.
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/postgres
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The harness drives the packaged native binary, so build it first.
      - run: bun run --cwd apps/cli build
      - run: bun run test:e2e:full
      - run: bun run tracked-tree:clean

  prisma:
    name: Prisma schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      SHADOW_DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun scripts/create-shadow-database.ts
      - run: bun run db:validate
      - run: bun run tracked-tree:clean
      - run: bun run db:migrate-check
      - run: bun run tracked-tree:clean

  docs:
    name: documentation and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run docs:validate
      - run: bun run tracked-tree:clean

  security:
    name: dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run security:audit
      - run: bun run tracked-tree:clean
  deploy-dev:
    name: deploy dev (Coolify)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build-smoke, unit, integration, browser-e2e, cli-round-trip, e2e-full, prisma, docs, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build and push dev API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api:latest
      - name: build and push dev web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web:latest
          build-args: |
            NEXT_PUBLIC_WEB_ORIGIN=https://dev.dotrelay.dev
            NEXT_PUBLIC_DOTRELAY_API_ORIGIN=https://dev-api.dotrelay.dev
            NEXT_PUBLIC_DOTRELAY_WEB_PROFILE=hosted
      - name: deploy dev apps via Coolify
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 scripts/coolify-deploy.py --environment dev
      - name: smoke dev origins
        run: |
          set -euo pipefail
          # /health is exempt from the API's secure-request gate, so probing
          # it alone cannot catch a TRUST_PROXY / X-Forwarded-Proto
          # misconfiguration that would 403 every real request. Probe
          # /api/v1/capabilities (public GET, still gated) instead.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://dev-api.dotrelay.dev/api/v1/capabilities -o /dev/null && curl -fsS --max-time 10 https://dev.dotrelay.dev -o /dev/null; then
              echo "dev origins healthy"; exit 0
            fi
            echo "waiting for dev origins to come up (${i}/12)..."; sleep 15
          done
          echo "dev origins did not become healthy" >&2; exit 1
  build-cli-dev:
    name: build dev CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build-smoke, unit, integration, browser-e2e, cli-round-trip, e2e-full, prisma, docs, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DOTRELAY_CLI_ORIGIN: https://dev-api.dotrelay.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      # The dev build is cut from this main commit: it is stamped with the
      # dev API origin and a dev version recording the commit sha.
      # Interpolate the sha with a GitHub expression instead of shell
      # expansion: on Windows steps run in PowerShell, where ${GITHUB_SHA}
      # resolves to an undefined PowerShell variable and the dev version
      # arrives without the sha.
      - run: bun run package:cli:version -- "v0.0.0-dev.${{ github.sha }}"
      - run: bun run --cwd apps/cli build
      - run: bun run package:cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-dev-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  publish-cli-dev:
    name: publish dev CLI (npm dev tag)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The dev CLI targets the dev API deployed by this same commit, so it is
    # published only after that deployment has cleared CI.
    needs: [build-cli-dev, deploy-dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-dev-*
          path: release-binaries
          merge-multiple: false
      - run: bun run package:cli:version -- "v0.0.0-dev.${{ github.sha }}"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
          # The artifact round-trip drops the executable bit off the staged
          # native binaries; restore it so the npm tarball ships 755
          # executables and the package smoke test can run them.
          find packages/dotrelay/dist -type f -name dotrelay -exec chmod +x {} +
      - run: bun scripts/test-cli-package.ts
      - run: npm pack --dry-run ./packages/dotrelay
      - name: publish npm dev selector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish ./packages/dotrelay --access public --tag dev

  tracked-tree-clean:
    name: tracked tree cleanliness
    runs-on: ubuntu-latest
    needs: [check, build-smoke, unit, integration, browser-e2e, cli-round-trip, e2e-full, prisma, docs, security, deploy-dev, build-cli-dev, publish-cli-dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run tracked-tree:clean
