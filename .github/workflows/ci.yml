name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs only validate npm trusted publishing (npm-trust-bootstrap).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Stable Bun builds, tests and ships DotRelay (ops/bun-toolchain.json).
  # scripts/setup-bun.py also installs a pinned canary, used only for the
  # built-in `bun lint` that stable releases do not include yet.
  BUN_VERSION: 38afee6c84fcf48c0edb2466aa4b27d287a59c30

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun run tracked-tree:clean

  build-smoke:
    name: build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run tracked-tree:clean
      - run: bun run smoke
      - run: bun run tracked-tree:clean

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:unit
      - run: bun run tracked-tree:clean

  integration:
    name: PostgreSQL and Valkey integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - run: bun run tracked-tree:clean

  browser-e2e:
    name: browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run tracked-tree:clean

  cli-round-trip:
    name: packaged CLI round trip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run test:cli
      - run: bun run test:cli:live
      - run: bun run tracked-tree:clean

  e2e-full:
    name: full-stack e2e (packaged CLI against real API + Postgres + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # The harness treats this as an ADMIN connection: it is a superuser on
      # this container, so it uses it to CREATE and DROP a throwaway database
      # per run. The maintenance "postgres" database always exists for that.
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/postgres
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The harness drives the packaged native binary, so build it first.
      - run: bun run --cwd apps/cli build
      - run: bun run test:e2e:full
      - run: bun run tracked-tree:clean

  prisma:
    name: Prisma schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      SHADOW_DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun scripts/create-shadow-database.ts
      - run: bun run db:validate
      - run: bun run tracked-tree:clean
      - name: Install PostgreSQL backup tools
        run: bash scripts/setup-backup-tools.sh
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
      - run: python3 ops/test_roundtrip.py
      - run: bun run db:migrate-check
      - run: bun run tracked-tree:clean

  container:
    name: production API image and readiness
    runs-on: ubuntu-latest
    services:
      # Production refuses the development dotrelay:dotrelay credentials, so
      # this job's disposable database uses a distinct password.
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: container-ci-only
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:container-ci-only@127.0.0.1:5432/dotrelay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun node_modules/prisma/build/index.js migrate deploy --config packages/database/prisma.config.ts
      - run: docker build -f apps/api/Dockerfile -t dotrelay-api-test .
      - run: python3 scripts/test-api-container.py

  docs:
    name: documentation and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run docs:validate
      - run: bun run tracked-tree:clean

  security:
    name: dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      # braces (GHSA-vfj7-8cjw-p6xm) has no patched release. The script ignores
      # that one advisory; it is only reached through shadcn's glob matcher.
      - run: bun run security:audit
      - run: bun run tracked-tree:clean
  # Deploys each main commit that passed CI to dev. Settings and the scoped
  # Coolify token live in the `dev` GitHub environment (main only).
  deploy-dev:
    name: deploy dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        check,
        build-smoke,
        unit,
        integration,
        browser-e2e,
        cli-round-trip,
        e2e-full,
        prisma,
        container,
        docs,
        security,
      ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      commit: ${{ github.sha }}

  # npm validates a new trusted publisher only after a publish from the
  # configured workflow file. This manual job publishes a placeholder
  # @dotrelay/cli under the "bootstrap" dist-tag (never "latest") so the
  # ci.yml publisher can be validated before the dev deployment can publish.
  npm-trust-bootstrap:
    name: validate npm trusted publishing (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The ci.yml npm trusted publishers are bound to this environment, so a
    # workflow edited on another branch cannot publish.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing (OIDC) needs npm 11.5.1+ on Node 22.14+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      # One placeholder per package validates the ci.yml trusted publisher on
      # each; release.yml's publisher is validated by the next release tag.
      - name: publish a bootstrap placeholder of every @dotrelay/cli package
        env:
          VERSION: 0.0.0-bootstrap.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          for name in @dotrelay/cli-linux-x64 @dotrelay/cli-linux-arm64 \
            @dotrelay/cli-darwin-x64 @dotrelay/cli-darwin-arm64 \
            @dotrelay/cli-win32-x64 @dotrelay/cli; do
            directory="$RUNNER_TEMP/bootstrap/${name#@dotrelay/}"
            mkdir -p "$directory"
            cat > "$directory/package.json" <<JSON
          {
            "name": "$name",
            "version": "$VERSION",
            "description": "Placeholder that validates trusted publishing. Install @dotrelay/cli@latest instead.",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/LSP-Software/DotRelay.git"
            }
          }
          JSON
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already published"
            else
              npm publish "$directory" --access public --tag bootstrap
            fi
          done

  build-cli-dev:
    name: build dev CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        check,
        build-smoke,
        unit,
        integration,
        browser-e2e,
        cli-round-trip,
        e2e-full,
        prisma,
        container,
        docs,
        security,
      ]
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    env:
      DOTRELAY_CLI_ORIGIN: https://dev-api.dotrelay.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      # The dev build is cut from this main commit: it is stamped with the
      # dev API origin and a dev version recording the commit sha.
      # Interpolate the sha with a GitHub expression instead of shell
      # expansion: on Windows steps run in PowerShell, where ${GITHUB_SHA}
      # resolves to an undefined PowerShell variable and the dev version
      # arrives without the sha.
      - run: bun run package:cli:version -- "v0.0.0-dev.${{ github.sha }}"
      - run: bun run --cwd apps/cli build
      - run: bun run package:cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-dev-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  publish-cli-dev:
    name: publish dev CLI (npm dev tag)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The dev CLI targets the dev API deployed by this same commit, so it is
    # published only after that deployment has cleared CI.
    needs: [build-cli-dev, deploy-dev]
    # The ci.yml npm trusted publishers are bound to this environment, so a
    # workflow edited on another branch cannot publish.
    environment: dev
    # npm --provenance signs with the job's OIDC token; without id-token the
    # publish fails before upload.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-dev-*
          path: release-binaries
          merge-multiple: false
      - run: bun run package:cli:version -- "v0.0.0-dev.${{ github.sha }}"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
      # One npm package per platform binary plus the selector that pins them;
      # --all fails if any release target is missing. Staging restores the
      # execute bit the artifact round trip drops.
      - run: bun run package:cli:npm --all
      # Trusted publishing (OIDC) needs npm 11.5.1+ on Node 22.14+. The
      # package test installs the packed tarballs with the same npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - run: bun scripts/test-cli-package.ts
      - name: publish npm dev platform packages, then the selector
        run: bun scripts/publish-cli.ts

  tracked-tree-clean:
    name: tracked tree cleanliness
    runs-on: ubuntu-latest
    needs:
      [
        check,
        build-smoke,
        unit,
        integration,
        browser-e2e,
        cli-round-trip,
        e2e-full,
        prisma,
        container,
        docs,
        security,
        deploy-dev,
        build-cli-dev,
        publish-cli-dev,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run tracked-tree:clean
