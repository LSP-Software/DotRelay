name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  verify:
    name: verify release source
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: git fetch origin main --depth=1
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run verify

  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build
      - run: bun run package:cli
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: cli-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  publish:
    name: publish CLI binaries and npm selector
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: cli-*
          path: release-binaries
          merge-multiple: false
      - run: bun run package:cli:version -- "${GITHUB_REF_NAME}"
      - run: mkdir -p packages/dotrelay/dist && cp -R release-binaries/*/* packages/dotrelay/dist/
      - run: bun scripts/test-cli-package.ts
      - run: npm pack --dry-run ./packages/dotrelay
      - name: publish npm selector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish ./packages/dotrelay --access public
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            release-binaries/**/*.exe
            release-binaries/**/dotrelay
          generate_release_notes: true
