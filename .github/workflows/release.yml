name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Canary channel: the built-in `bun lint` linter is not enabled in stable
  # releases yet (it is gated behind the canary build flavor).
  BUN_VERSION: da867c60bf0bcbf9d6d36994f8ca0efa42075115

jobs:
  verify:
    name: verify release source
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: git fetch origin main --depth=1
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      # `verify` leaves the advisory audit to CI; a release must pass it on
      # the tagged commit itself.
      - run: bun run security:audit
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - run: bash scripts/setup-backup-tools.sh
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
      - run: python3 ops/test_roundtrip.py

  e2e-full:
    name: full-stack e2e (packaged CLI against real API + Postgres + Valkey)
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Admin (superuser) connection: the harness uses it to CREATE and DROP a
      # throwaway database per run. The "postgres" maintenance DB always exists.
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/postgres
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build
      - run: bun run test:e2e:full
      - run: bun run tracked-tree:clean

  build-images:
    name: build and push images
    needs: [verify, e2e-full]
    # Public images for self-hosters. Hosted production does not pull them:
    # Coolify builds the tagged commit with railpack (deploy-prod). The mutable
    # latest-stable tag still clears the security-review gate before it moves.
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Require independent approval of this exact commit (stable)
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          # Prereleases (alpha, beta, rc) still need an approver in the
          # security-review environment, but not the independent review:
          # testers must not store real secrets in them. Stable releases
          # require the review of this exact commit.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease without independent security review. Keep production admission restricted to the alpha allow-list."
            exit 0
          fi
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      # Alphas are versions of the production service, so every release
      # builds for the production origins.
      - name: resolve release origins
        id: origins
        run: |
          echo "web-origin=https://dotrelay.dev" >> "$GITHUB_OUTPUT"
          echo "api-origin=https://api.dotrelay.dev" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            docker.io/lspsoftware/dotrelay-api:${{ github.ref_name }}
            docker.io/lspsoftware/dotrelay-api:${{ contains(github.ref_name, '-') && 'latest-alpha' || 'latest-stable' }}
      - name: build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            docker.io/lspsoftware/dotrelay-web:${{ github.ref_name }}
            docker.io/lspsoftware/dotrelay-web:${{ contains(github.ref_name, '-') && 'latest-alpha' || 'latest-stable' }}
          build-args: |
            NEXT_PUBLIC_WEB_ORIGIN=${{ steps.origins.outputs.web-origin }}
            NEXT_PUBLIC_DOTRELAY_API_ORIGIN=${{ steps.origins.outputs.api-origin }}
            NEXT_PUBLIC_DOTRELAY_WEB_PROFILE=hosted

  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: [verify, e2e-full]
    strategy:
      fail-fast: false
      matrix:
        # Native runners build each <platform>-<arch>: ubuntu-latest linux-x64,
        # ubuntu-24.04-arm linux-arm64, macos-latest darwin-arm64,
        # macos-15-intel darwin-x64, windows-latest win32-x64.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - name: stamp CLI version from the release tag
        # bash so the Windows matrix job expands $RELEASE_TAG like the
        # POSIX runners (PowerShell would read it as an unset variable).
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run package:cli:version -- "$RELEASE_TAG"
      - run: bun run --cwd apps/cli build
      # Signing runs only once its credentials exist; until then releases
      # ship unsigned binaries (npm and curl installs are not quarantined).
      - name: detect signing credentials
        id: signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          macos=false; windows=false
          [[ "$RUNNER_OS" == macOS && -n "$APPLE_DEVELOPER_ID_P12_BASE64" ]] && macos=true
          [[ "$RUNNER_OS" == Windows && -n "$AZURE_CLIENT_ID" ]] && windows=true
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
      - name: sign and notarize the macOS binary
        if: steps.signing.outputs.macos == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-macos.sh apps/cli/dist/dotrelay
      - name: sign the Windows binary (Azure Artifact Signing)
        if: steps.signing.outputs.windows == 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\cli\dist\dotrelay.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: DotRelay CLI
          description-url: https://github.com/LSP-Software/DotRelay
      - run: bun run package:cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  # The packaged binaries run here, in a job with read-only permissions, no
  # environment and no secrets, so a compromised build dependency that ends
  # up in a binary never executes with the publish job's write, OIDC and
  # attestation permissions.
  smoke-cli-package:
    name: smoke-test the packaged CLI (unprivileged)
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-*
          path: release-binaries
          merge-multiple: false
      - name: stamp CLI version from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run package:cli:version -- "$RELEASE_TAG"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
          find packages/dotrelay/dist -type f -name dotrelay -exec chmod +x {} +
      - run: bun scripts/test-cli-package.ts

  publish:
    name: publish CLI binaries and npm selector
    needs: [build-cli, build-images, smoke-cli-package]
    environment: security-review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          # Prereleases (alpha, beta, rc) still need an approver in the
          # security-review environment, but not the independent review:
          # testers must not store real secrets in them. Stable releases
          # require the review of this exact commit.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease without independent security review. Keep production admission restricted to the alpha allow-list."
            exit 0
          fi
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: cli-*
          path: release-binaries
          merge-multiple: false
      - name: stamp CLI version from the release tag
        # bash so the Windows matrix job expands $RELEASE_TAG like the
        # POSIX runners (PowerShell would read it as an unset variable).
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run package:cli:version -- "$RELEASE_TAG"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
          cp LICENSE.md packages/dotrelay/LICENSE.md
          # The artifact round-trip drops the executable bit off the staged
          # native binaries; restore it so the npm tarball ships 755
          # executables. This job never runs them: smoke-cli-package did.
          find packages/dotrelay/dist -type f -name dotrelay -exec chmod +x {} +
      - run: npm pack --dry-run --ignore-scripts ./packages/dotrelay
      - name: Package unique platform release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py
      - name: Bind exact release artifacts and review evidence
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-evidence.ts
      - name: Sign exact release artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-binaries/**/*
      # The GitHub release is created as a draft first so a failed upload
      # stops before npm publication, which cannot be undone. It is made
      # public only after npm accepts the selector.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          files: |
            release-binaries/*.tar.gz
            release-binaries/*.zip
            release-binaries/release-manifest.json
            release-binaries/SHA256SUMS
            ${{ steps.provenance.outputs.bundle-path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      # Trusted publishing (OIDC) needs npm 11.5.1+ on Node 22.14+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: publish npm selector
        run: bun scripts/publish-cli.ts
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Every approved v* tag deploys production; alpha, beta and rc are versions
  # of dotrelay.dev, admitted by the API's alpha allow-list.
  deploy-prod:
    name: deploy prod (Coolify)
    needs: [build-cli, build-images, publish]
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          # Prereleases (alpha, beta, rc) still need an approver in the
          # security-review environment, but not the independent review:
          # testers must not store real secrets in them. Stable releases
          # require the review of this exact commit.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a prerelease without independent security review. Keep production admission restricted to the alpha allow-list."
            exit 0
          fi
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      # Coolify builds the production apps from Git with railpack, pinned to
      # the tagged commit the security review approved. The API applies
      # pending migrations at start (scripts/hosted-migrate.ts) before it serves.
      - name: deploy prod apps via Coolify
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 scripts/coolify-deploy.py --environment production --commit "$GITHUB_SHA"
      - name: smoke deployment readiness and trust boundary
        env:
          SMOKE_API_ORIGIN: https://api.dotrelay.dev
          SMOKE_WEB_ORIGIN: https://dotrelay.dev
          SMOKE_SERVER_PROFILE_ID: ${{ vars.PRODUCTION_SERVER_PROFILE_ID }}
        run: python3 scripts/smoke-deployment.py
