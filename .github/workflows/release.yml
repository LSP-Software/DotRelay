name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.0

jobs:
  verify:
    name: verify release source
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: git fetch origin main --depth=1
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run verify

  build-images:
    name: build and push images
    needs: verify
    # The mutable latest-stable tag is published in this job, so it must clear
    # the same security-review gate as publish/deploy-prod before it can move
    # the tag that production pulls.
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api:latest-stable
      - name: build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web:latest-stable
          build-args: |
            NEXT_PUBLIC_WEB_ORIGIN=https://dotrelay.dev
            NEXT_PUBLIC_DOTRELAY_API_ORIGIN=https://api.dotrelay.dev

  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run package:cli:version -- "${GITHUB_REF_NAME}"
      - run: bun run --cwd apps/cli build
      - run: bun run package:cli
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: cli-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  publish:
    name: publish CLI binaries and npm selector
    needs: build-cli
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVAL: ${{ vars.SECURITY_REVIEW_APPROVAL }}
        run: test "$SECURITY_REVIEW_APPROVAL" = approved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: cli-*
          path: release-binaries
          merge-multiple: false
      - run: bun run package:cli:version -- "${GITHUB_REF_NAME}"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
          # The artifact round-trip drops the executable bit off the staged
          # native binaries; restore it so the npm tarball ships 755
          # executables and the package smoke test can run them.
          find packages/dotrelay/dist -type f -name dotrelay -exec chmod +x {} +
      - run: bun scripts/test-cli-package.ts
      - run: npm pack --dry-run ./packages/dotrelay
      - name: publish npm selector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish ./packages/dotrelay --access public
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            release-binaries/**/*.exe
            release-binaries/**/dotrelay
          generate_release_notes: true

  deploy-prod:
    name: deploy prod (Coolify)
    needs: [build-cli, build-images, publish]
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVAL: ${{ vars.SECURITY_REVIEW_APPROVAL }}
        run: test "$SECURITY_REVIEW_APPROVAL" = approved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: deploy prod apps via Coolify
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 scripts/coolify-deploy.py --environment production
      - name: smoke prod origins
        run: |
          set -euo pipefail
          # /health is exempt from the API's secure-request gate, so probing
          # it alone cannot catch a TRUST_PROXY / X-Forwarded-Proto
          # misconfiguration that would 403 every real request. Probe
          # /api/v1/capabilities (public GET, still gated) instead.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.dotrelay.dev/api/v1/capabilities -o /dev/null && curl -fsS --max-time 10 https://dotrelay.dev -o /dev/null; then
              echo "prod origins healthy"; exit 0
            fi
            echo "waiting for prod origins to come up (${i}/12)..."; sleep 15
          done
          echo "prod origins did not become healthy" >&2; exit 1
