name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Canary channel: the built-in `bun lint` linter is not enabled in stable
  # releases yet (it is gated behind the canary build flavor).
  BUN_VERSION: da867c60bf0bcbf9d6d36994f8ca0efa42075115

jobs:
  verify:
    name: verify release source
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/dotrelay
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: git fetch origin main --depth=1
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify
      - run: bash scripts/setup-backup-tools.sh
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
      - run: python3 ops/test_roundtrip.py

  e2e-full:
    name: full-stack e2e (packaged CLI against real API + Postgres + Valkey)
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: dotrelay
          POSTGRES_PASSWORD: dotrelay
          POSTGRES_DB: dotrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dotrelay -d dotrelay"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Admin (superuser) connection: the harness uses it to CREATE and DROP a
      # throwaway database per run. The "postgres" maintenance DB always exists.
      DATABASE_URL: postgresql://dotrelay:dotrelay@127.0.0.1:5432/postgres
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/cli build
      - run: bun run test:e2e:full
      - run: bun run tracked-tree:clean

  build-images:
    name: build and push images
    needs: [verify, e2e-full]
    # The mutable latest-stable tag is published in this job, so it must clear
    # the same security-review gate as publish/deploy-prod before it can move
    # the tag that production pulls.
    environment: security-review
    runs-on: ubuntu-latest
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Require independent approval of this exact commit
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: resolve release origins
        id: origins
        env:
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          ALPHA_WEB_ORIGIN: ${{ vars.ALPHA_WEB_ORIGIN }}
          ALPHA_API_ORIGIN: ${{ vars.ALPHA_API_ORIGIN }}
        run: |
          node <<'JS'
          const { appendFileSync } = require('node:fs');
          const alpha = process.env.PRERELEASE === 'true';
          const origins = {
            'web-origin': alpha ? process.env.ALPHA_WEB_ORIGIN : 'https://dotrelay.dev',
            'api-origin': alpha ? process.env.ALPHA_API_ORIGIN : 'https://api.dotrelay.dev',
          };
          for (const [name, value] of Object.entries(origins)) {
            if (!value) throw new Error(`Configure ALPHA_WEB_ORIGIN and ALPHA_API_ORIGIN before publishing a prerelease (${name} is missing)`);
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.origin !== value) {
              throw new Error(`${name} must be an exact HTTPS origin; configure ALPHA_WEB_ORIGIN and ALPHA_API_ORIGIN for prereleases`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          JS
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: build and push API image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api:${{ contains(github.ref_name, '-') && 'latest-alpha' || 'latest-stable' }}
      - name: build and push web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web:${{ contains(github.ref_name, '-') && 'latest-alpha' || 'latest-stable' }}
          build-args: |
            NEXT_PUBLIC_WEB_ORIGIN=${{ steps.origins.outputs.web-origin }}
            NEXT_PUBLIC_DOTRELAY_API_ORIGIN=${{ steps.origins.outputs.api-origin }}
            NEXT_PUBLIC_DOTRELAY_WEB_PROFILE=hosted

  build-cli:
    name: build CLI (${{ matrix.os }})
    needs: [verify, e2e-full]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - run: bun install --frozen-lockfile
      - name: stamp CLI version from the release tag
        # bash so the Windows matrix job expands $RELEASE_TAG like the
        # POSIX runners (PowerShell would read it as an unset variable).
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run package:cli:version -- "$RELEASE_TAG"
      - run: bun run --cwd apps/cli build
      - run: bun run package:cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.os }}
          path: packages/dotrelay/dist
          if-no-files-found: error

  publish:
    name: publish CLI binaries and npm selector
    needs: [build-cli, build-images]
    environment: security-review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Install verified pinned Bun toolchain
        run: python3 scripts/setup-bun.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: release-binaries
          merge-multiple: false
      - name: stamp CLI version from the release tag
        # bash so the Windows matrix job expands $RELEASE_TAG like the
        # POSIX runners (PowerShell would read it as an unset variable).
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run package:cli:version -- "$RELEASE_TAG"
      - run: |
          mkdir -p packages/dotrelay/dist
          cp -R release-binaries/*/* packages/dotrelay/dist/
          # The artifact round-trip drops the executable bit off the staged
          # native binaries; restore it so the npm tarball ships 755
          # executables and the package smoke test can run them.
          find packages/dotrelay/dist -type f -name dotrelay -exec chmod +x {} +
      - run: bun scripts/test-cli-package.ts
      - run: npm pack --dry-run ./packages/dotrelay
      - name: Package unique platform release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py
      - name: Bind exact release artifacts and review evidence
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          API_IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-api@${{ needs.build-images.outputs.api-digest }}
          WEB_IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/dotrelay-web@${{ needs.build-images.outputs.web-digest }}
        run: bun scripts/release-evidence.ts
      - name: Sign exact release artifact provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-binaries/**/*
      - name: publish npm selector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-cli.ts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            release-binaries/*.tar.gz
            release-binaries/*.zip
            release-binaries/release-manifest.json
            release-binaries/SHA256SUMS
            ${{ steps.provenance.outputs.bundle-path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  deploy-prod:
    name: deploy prod (Coolify)
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [build-cli, build-images, publish]
    environment: security-review
    runs-on: ubuntu-latest
    steps:
      - name: Verify recorded privacy-boundary approval
        env:
          SECURITY_REVIEW_APPROVED_SHA: ${{ vars.SECURITY_REVIEW_APPROVED_SHA }}
          SECURITY_REVIEW_REPORT_SHA256: ${{ vars.SECURITY_REVIEW_REPORT_SHA256 }}
        run: |
          test "$SECURITY_REVIEW_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$SECURITY_REVIEW_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Require operator migration receipt for this commit
        env:
          MIGRATED_COMMIT_SHA: ${{ vars.PRODUCTION_MIGRATED_COMMIT_SHA }}
        run: test "$MIGRATED_COMMIT_SHA" = "$GITHUB_SHA"
      - name: deploy prod apps via Coolify
        env:
          COOLIFY_ENDPOINT: ${{ secrets.COOLIFY_ENDPOINT }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: python3 scripts/coolify-deploy.py --environment production
      - name: smoke deployment readiness and trust boundary
        env:
          SMOKE_API_ORIGIN: https://api.dotrelay.dev
          SMOKE_WEB_ORIGIN: https://dotrelay.dev
          SMOKE_SERVER_PROFILE_ID: ${{ vars.PRODUCTION_SERVER_PROFILE_ID }}
        run: python3 scripts/smoke-deployment.py
