name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"

concurrency:
  group: wiki-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: publish canonical Wiki source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Checkout Wiki repository
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          if ! git ls-remote "$WIKI_URL" >/dev/null 2>wiki-error.txt; then
            echo "::error::The GitHub Wiki repository ${GITHUB_REPOSITORY}.wiki.git is unavailable. Enable the repository Wiki or create the Wiki repository before publishing canonical docs/wiki source."
            cat wiki-error.txt
            exit 1
          fi
          git clone "$WIKI_URL" wiki
      - name: Mirror canonical source
        run: |
          rsync -a --delete --exclude .git/ docs/wiki/ wiki/
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add --all
          if git -C wiki diff --cached --quiet; then
            echo "Wiki is already up to date"
          else
            git -C wiki commit -m "docs: publish Wiki source from $GITHUB_SHA"
            git -C wiki push origin HEAD
          fi
