services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dotrelay
      POSTGRES_PASSWORD: dotrelay
      POSTGRES_DB: dotrelay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotrelay -d dotrelay"]
      interval: 10s
      timeout: 5s
      retries: 5
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
